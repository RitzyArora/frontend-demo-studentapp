  <div style="padding:20px;">

  <mat-toolbar color="primary">

    <span>Students</span>

    <span style="flex: 1 1 auto;"></span>

    <button
      mat-raised-button
      color="accent"
      *ngIf="isAdmin"
      (click)="openAddForm()"
    >
      Add Student
    </button>

    &nbsp;

    <button
      mat-raised-button
      color="warn"
      (click)="logout()"
    >
      Logout
    </button>

  </mat-toolbar>

  <br>

  <app-student-form

    *ngIf="showForm"

    [student]="selectedStudent"

    [editMode]="editMode"

    (saved)="onSaved()"

    (closed)="closeForm()">

  </app-student-form>

  <mat-card>

    <table
      mat-table
      [dataSource]="students"
      class="mat-elevation-z8"
      style="width:100%;"
    >

      <!-- Name -->

      <ng-container matColumnDef="name">

        <th mat-header-cell *matHeaderCellDef>
          Name
        </th>

        <td mat-cell *matCellDef="let s">
          {{s.studentName}}
        </td>

      </ng-container>

      <!-- Age -->

      <ng-container matColumnDef="age">

        <th mat-header-cell *matHeaderCellDef>
          Age
        </th>

        <td mat-cell *matCellDef="let s">
          {{s.studentAge}}
        </td>

      </ng-container>

      <!-- Marks -->

      <ng-container matColumnDef="marks">

        <th mat-header-cell *matHeaderCellDef>
          Marks
        </th>

        <td mat-cell *matCellDef="let s">
          {{s.studentMarks}}
        </td>

      </ng-container>

      <!-- Grade -->

      <ng-container matColumnDef="grade">

        <th mat-header-cell *matHeaderCellDef>
          Grade
        </th>

        <td mat-cell *matCellDef="let s">
          {{s.grade}}
        </td>

      </ng-container>

      <!-- Actions -->

      <ng-container
        matColumnDef="actions"
        *ngIf="isAdmin"
      >

        <th mat-header-cell *matHeaderCellDef>
          Actions
        </th>

        <td mat-cell *matCellDef="let s">

          <button
            mat-icon-button
            color="primary"
            (click)="editStudent(s)"
          >
            <mat-icon>edit</mat-icon>
          </button>

          <button
            mat-icon-button
            color="warn"
            (click)="deleteStudent(s.studentId)"
          >
            <mat-icon>delete</mat-icon>
          </button>

        </td>

      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns"
      ></tr>

      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns;"
      ></tr>

    </table>

  </mat-card>

</div>
